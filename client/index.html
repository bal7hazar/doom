<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Hellproof — playable preview</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Cpath%20fill%3D%22%23c33%22%20d%3D%22M2%202h4v5h4V2h4v12h-4V9H6v5H2z%22%2F%3E%3C%2Fsvg%3E" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="view"></canvas>
      <canvas id="overlay"></canvas>
      <div id="loading" class="panel">
        <h1>Hellproof</h1>
        <p id="loading-status">Booting…</p>
        <progress id="loading-progress" max="100" value="0"></progress>
      </div>
      <div id="diagnostics" class="panel diagnostics" hidden></div>
      <div id="stats" class="stats"></div>
      <div id="help" class="help">
        <b>F1</b> diagnostics · <b>Tab</b> automap · <b>F2</b> HUD · <b>F3</b> light-only ·
        <b>F4</b> proof queue · <b>Space</b> pause · <b>[</b>/<b>]</b> sim rate
      </div>
      <div id="orientation" class="panel orientation" role="dialog" aria-label="Rotate your device" hidden>
        <h1>Hellproof</h1>
        <p>Turn your phone to <b>landscape</b> to play: the view, the joystick and the buttons are laid out for a wide screen.</p>
        <button type="button" id="orientation-dismiss">Continue in portrait anyway</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
