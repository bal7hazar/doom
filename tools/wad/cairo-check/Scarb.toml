[package]
name = "cairo_check"
version = "0.1.0"
edition = "2024_07"

# Throwaway package (roadmap P0.2): its only purpose is to prove that the
# `.cairo` file generated by `npm run extract` (tools/wad/out/e1m1.cairo)
# actually compiles under Cairo/Scarb 2024_07, i.e. that the packed
# `const` arrays produced by src/cairoOutput.ts are syntactically valid and
# fit the felt252/u32 type constraints documented in that file's header.
#
# Usage: copy the freshly generated map file into src/e1m1.cairo, then
# `scarb build` (see ../scripts/verify-cairo.sh, or `npm run verify:cairo`
# from tools/wad/). src/e1m1.cairo is generated/copied, not committed (see
# ../.gitignore).

[dependencies]

[dev-dependencies]
cairo_test = "2.16.0"
