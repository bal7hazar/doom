<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hellproof prover — wasm64 harness (S2)</title>
    <link rel="icon" href="data:," />
    <style>
      body { font: 13px/1.4 ui-monospace, Menlo, monospace; margin: 1rem; color: #ddd; background: #111; }
      table { border-collapse: collapse; margin: 1rem 0; }
      td, th { border: 1px solid #444; padding: 2px 8px; text-align: right; }
      #log { height: 22rem; overflow: auto; border: 1px solid #444; padding: 4px; white-space: pre-wrap; }
      .lvl-error { color: #f66; } .lvl-warn { color: #fc6; } .lvl-debug { color: #888; }
      input, select, textarea, button { font: inherit; }
      textarea { width: 40rem; height: 8rem; }
    </style>
  </head>
  <body>
    <h1>Hellproof prover — wasm64 harness</h1>
    <div id="env"></div>
    <p>
      k: <select id="k"><option>14</option><option>16</option><option>18</option><option>19</option></select>
      <label><input type="checkbox" id="fresh" checked /> fresh worker per run</label>
      <button id="run">execute → prove → verify</button>
    </p>
    <p>prover params JSON (empty = built-in leaf defaults):<br /><textarea id="params"></textarea></p>
    <table>
      <thead><tr><th>k</th><th>steps</th><th>execute ms</th><th>prove ms</th><th>verify ms</th><th>proof felts</th><th>wasm mem GiB</th><th>UA mem peak GiB</th><th>verified</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="log"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
