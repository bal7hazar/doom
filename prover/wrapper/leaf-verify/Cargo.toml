# Standalone workspace: this crate pulls the pinned monorepo's dependency tree and must not be
# built together with the service (`prover/wrapper/`), which has no monorepo dependency at all.
[workspace]

[package]
name = "hellproof-leaf-verify"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust verifier front end for Hellproof: verifies a browser-produced Cairo segment proof and prints its public output, so the wrapper can reject invalid leaves in seconds (R8-A1)"
license = "Apache-2.0"

[[bin]]
name = "hellproof-leaf-verify"
path = "src/main.rs"

# The monorepo is pinned by full commit hash (R3-A1, `cd7bc5f`). Only the verifier side is needed
# here: `cairo-air` does not depend on the prover crates, so this binary builds in a fraction of
# the monorepo's build time and links none of the proving machinery.
[dependencies]
cairo-air = { git = "https://github.com/starkware-libs/proving", rev = "cd7bc5f4697fb188a27e09f9242f1dd76df8afdc" }
stwo = { git = "https://github.com/starkware-libs/proving", rev = "cd7bc5f4697fb188a27e09f9242f1dd76df8afdc" }

anyhow = "1.0"
bincode = "1.3"
bzip2 = "0.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
starknet-ff = "0.3.7"

[profile.release]
opt-level = 3
debug = false
