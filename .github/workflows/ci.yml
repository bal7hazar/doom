name: CI

on:
  push:
    branches: [main]
  pull_request:

# GitHub Actions has no single "whole workflow" timeout: the closest
# equivalent is bounding every job with `timeout-minutes` (below), since jobs
# run in parallel and none of them `needs:` another.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # 1. cairo/ workspace: fmt, build, test, doom_run execution smoke test,
  #    the crate-graph rule (PLAN.md §3.1 A10), and every crate's step-cost
  #    budget bench (cairo/crates/*/bench/measure.py).
  #
  #    cairo/crates/*/bench/coverage.py (cairo-coverage line coverage) is
  #    deliberately NOT run here. It is a much heavier and more fragile path
  #    than the workspace's own `scarb test`: coverage.py copies each crate
  #    to a scratch directory, patches its manifest to swap in snforge_std +
  #    gas + three profile flags, and drives `snforge test --coverage`
  #    through cairo-coverage 0.5.0 -- a third build toolchain (on top of
  #    scarb 2.16.0) that must also carry a compatible universal-sierra-
  #    compiler. A local dry run hit a Sierra-compilation "Offset overflow"
  #    on one crate purely from a stale universal-sierra-compiler on the
  #    dry-run machine, with no code change involved -- exactly the kind of
  #    toolchain-version flakiness a merge gate should not depend on until
  #    it has been proven stable across crates in CI itself. It remains a
  #    `python3 cairo/crates/<crate>/bench/coverage.py` away, for local use
  #    and as a follow-up to wire in once it has run green in CI a few times.
  # ---------------------------------------------------------------------
  cairo:
    name: cairo (fmt, build, test, execute, crate graph, benches)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check cairo/ exists
        id: check
        run: |
          if [ -f "cairo/Scarb.toml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up scarb (from cairo/.tool-versions)
        if: steps.check.outputs.present == 'true'
        uses: software-mansion/setup-scarb@v1
        with:
          tool-versions: cairo/.tool-versions

      - name: scarb fmt --check
        if: steps.check.outputs.present == 'true'
        working-directory: cairo
        run: scarb fmt --check

      - name: scarb build
        if: steps.check.outputs.present == 'true'
        working-directory: cairo
        run: scarb build

      - name: scarb test
        if: steps.check.outputs.present == 'true'
        working-directory: cairo
        run: scarb test

      - name: scarb execute -p doom_run
        if: steps.check.outputs.present == 'true'
        working-directory: cairo
        run: scarb execute -p doom_run --arguments 1 --output none

      - name: Crate dependency graph check (PLAN.md §3.1 A10)
        if: steps.check.outputs.present == 'true'
        run: python3 infra/check_crate_graph.py

      - name: Per-crate step-cost budgets (bench/measure.py)
        if: steps.check.outputs.present == 'true'
        run: bash infra/ci/run-cairo-benches.sh

  # ---------------------------------------------------------------------
  # 2. cairo/doom_contracts: the on-chain verifier workspace. Its own
  #    .tool-versions pins scarb 2.18.0 + starknet-foundry 0.61.0 (0.57.0
  #    cannot run its Sierra 1.8 test artifacts). snforge is already
  #    configured with tracked_resource = "cairo-steps" in each crate's
  #    Scarb.toml, matching what devnet/blockifier 0.14.4 bills.
  #
  #    Deliberately NOT run: tools/devnet_drive.py, tools/devnet_probe.py,
  #    tools/check_registry.sh -- they drive a real starknet-devnet instance
  #    (declare/deploy/drive a live contract) and are measurement tooling
  #    for docs/design/onchain-verifier.md, not a merge gate.
  # ---------------------------------------------------------------------
  contracts:
    name: cairo/doom_contracts (build, snforge test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check cairo/doom_contracts/ exists
        id: check
        run: |
          if [ -f "cairo/doom_contracts/Scarb.toml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up scarb (from cairo/doom_contracts/.tool-versions)
        if: steps.check.outputs.present == 'true'
        uses: software-mansion/setup-scarb@v1
        with:
          tool-versions: cairo/doom_contracts/.tool-versions

      - name: Set up starknet-foundry (from cairo/doom_contracts/.tool-versions)
        if: steps.check.outputs.present == 'true'
        uses: foundry-rs/setup-snfoundry@v6
        with:
          tool-versions: cairo/doom_contracts/.tool-versions

      - name: Unpack proof fixtures
        if: steps.check.outputs.present == 'true'
        working-directory: cairo/doom_contracts
        run: sh fixtures/unpack.sh

      - name: scarb build
        if: steps.check.outputs.present == 'true'
        working-directory: cairo/doom_contracts
        run: scarb build

      - name: snforge test (stwo_circuit_phases)
        if: steps.check.outputs.present == 'true'
        working-directory: cairo/doom_contracts/crates/stwo_circuit_phases
        run: snforge test

      - name: snforge test (doom_contracts)
        if: steps.check.outputs.present == 'true'
        working-directory: cairo/doom_contracts/crates/doom_contracts
        run: snforge test

  # ---------------------------------------------------------------------
  # 3. tools/wad: the WAD extraction library/CLI (npm workspace member).
  #    npm test is hermetic (synthetic in-memory WADs) and always runs;
  #    verify-cairo.sh additionally proves a real-WAD extraction compiles
  #    under Scarb, so it needs the actual Freedoom IWAD (cached, see
  #    .github/actions/fetch-freedoom).
  # ---------------------------------------------------------------------
  wad:
    name: tools/wad (typecheck, test, verify-cairo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check tools/wad/ exists
        id: check
        run: |
          if [ -f "tools/wad/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci (workspace root)
        if: steps.check.outputs.present == 'true'
        run: npm ci

      - name: typecheck
        if: steps.check.outputs.present == 'true'
        run: npm run typecheck --workspace tools/wad

      - name: npm test
        if: steps.check.outputs.present == 'true'
        run: npm test --workspace tools/wad

      - name: Fetch Freedoom WAD (cached)
        if: steps.check.outputs.present == 'true'
        uses: ./.github/actions/fetch-freedoom

      - name: Extract E1M1 (writes out/e1m1.cairo for verify-cairo.sh)
        if: steps.check.outputs.present == 'true'
        run: |
          set +e
          npm run extract --workspace tools/wad -- \
            --wad "$FREEDOOM_DIR/freedoom1.wad" --map E1M1 --out tools/wad/out
          code=$?
          set -e
          # Exit 3 is the documented R2-A12 bytecode-budget gate: real E1M1
          # exceeds it even fully packed (tools/wad/README.md "Bytecode
          # budget"), and the extractor still writes out/e1m1.cairo before
          # that check runs, which is all verify-cairo.sh needs. Any other
          # non-zero exit is a real failure.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi

      - name: Set up scarb (for cairo-check)
        if: steps.check.outputs.present == 'true'
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.16.0"

      - name: verify-cairo.sh
        if: steps.check.outputs.present == 'true'
        run: bash tools/wad/scripts/verify-cairo.sh e1m1

  # ---------------------------------------------------------------------
  # 4. client/: the WebGL2 renderer (npm workspace member, depends on
  #    tools/wad via the workspace). npm test is hermetic; the Playwright
  #    smoke test runs against `vite preview` (the production bundle) in
  #    headless Chromium on SwiftShader (no GPU) and is calibrated for
  #    exactly this environment: 640x400, a >= 30 fps floor (the roadmap's
  #    minimum, not the 60 fps hardware-GPU target), 1 worker, no retries.
  #    A dry run on comparable hardware measured 46 fps / 0 dropped tics in
  #    ~15s for all 4 tests, so it runs as a real (non-allow-failure) gate.
  # ---------------------------------------------------------------------
  client:
    name: client (test, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check client/ exists
        id: check
        run: |
          if [ -f "client/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci (workspace root)
        if: steps.check.outputs.present == 'true'
        run: npm ci

      - name: npm test
        if: steps.check.outputs.present == 'true'
        run: npm test --workspace client

      - name: npm run build
        if: steps.check.outputs.present == 'true'
        run: npm run build --workspace client

      - name: Fetch Freedoom WAD (cached)
        if: steps.check.outputs.present == 'true'
        uses: ./.github/actions/fetch-freedoom

      - name: Prepare renderer assets (freedoom1.wad + levels/e1m1.json)
        if: steps.check.outputs.present == 'true'
        run: npm run assets --workspace client

      - name: Install Playwright Chromium
        if: steps.check.outputs.present == 'true'
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e (headless, SwiftShader)
        if: steps.check.outputs.present == 'true'
        working-directory: client
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: steps.check.outputs.present == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-playwright-report
          path: client/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------
  # 5. Rust crates: prover/sim (real-time cairo-vm execution in the
  #    browser) and prover/wrapper (the wrapper service). Both are their
  #    own standalone Cargo workspaces (`[workspace]` with no members) so
  #    they are cached and built independently.
  #
  #    prover/wrapper's tests/pipeline_e2e.rs and tests/load.rs carry
  #    #[ignore] real-pipeline tests (32.5 GB / run, needs a running
  #    wrapper) -- `cargo test`'s default already excludes #[ignore]d
  #    tests, so nothing extra is needed to keep them out of CI.
  #
  #    `cargo clippy -- -D warnings` runs on both but is NON-BLOCKING
  #    (continue-on-error) because neither crate is clippy-clean today:
  #      - prover/sim: `clippy::incompatible_msrv` on `is_multiple_of`
  #        (stable since 1.87, but Cargo.toml pins rust-version = "1.85") in
  #        src/core.rs.
  #      - prover/wrapper: 3x `clippy::field_reassign_with_default` in
  #        src/config.rs, tests/common/mod.rs and tests/pipeline_e2e.rs.
  #    These are real, fixable findings (not flagged for silent fixing here
  #    per this change's scope), and the step still runs and reports on
  #    every CI run so regressions beyond today's baseline are visible.
  #    Once both crates are clean, drop `continue-on-error` to make it a
  #    real gate, matching the "if clean" condition this step was asked
  #    for.
  #
  #    `cargo fmt --check` DOES block: prover/wrapper is already clean;
  #    prover/sim currently is not (import ordering in src/bin/bench.rs,
  #    a wrapped `end_run` call in src/core.rs, a wrapped `load_with_mode`
  #    call in src/wasm.rs) -- a one-command, no-behavior-change fix
  #    (`cargo fmt`) left as a follow-up rather than made here, since it's
  #    a source-code change and not test-runner config.
  #
  #    prover/wasm (the WASM64 Stwo prover build) is intentionally NOT
  #    built here: it is a separate, much heavier toolchain (a pinned
  #    nightly, `-Z build-std`, a vendored `starkware-libs/proving`
  #    checkout) that another workstream owns in its own
  #    .github/workflows/prover-wasm.yml. At the time of this change that
  #    file does not exist yet -- TODO(ci): once it lands, nothing here
  #    needs to change; if it never lands, prover/wasm needs its own job.
  #
  #    prover/wrapper/leaf-verify/ (its own workspace, pulls the pinned
  #    starkware-libs/proving monorepo as a dependency to get cairo-air) is
  #    also out of scope here for the same reason: it is a heavy, slow
  #    build pulling a large external monorepo, not exercised by
  #    `cargo test` in prover/wrapper itself, and not requested by this
  #    change's job list.
  # ---------------------------------------------------------------------
  rust:
    name: rust (prover/sim, prover/wrapper)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check prover/sim and prover/wrapper
        id: check
        run: |
          if [ -f "prover/sim/Cargo.toml" ]; then
            echo "sim=true" >> "$GITHUB_OUTPUT"
          else
            echo "sim=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "prover/wrapper/Cargo.toml" ]; then
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "wrapper=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust (stable, rustfmt + clippy)
        if: steps.check.outputs.sim == 'true' || steps.check.outputs.wrapper == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and targets
        if: steps.check.outputs.sim == 'true' || steps.check.outputs.wrapper == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            prover/sim
            prover/wrapper

      - name: prover/sim -- cargo fmt --check
        if: steps.check.outputs.sim == 'true'
        working-directory: prover/sim
        run: cargo fmt --check

      - name: prover/sim -- cargo clippy -D warnings (non-blocking, see note above)
        if: steps.check.outputs.sim == 'true'
        working-directory: prover/sim
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: prover/sim -- cargo test
        if: steps.check.outputs.sim == 'true'
        working-directory: prover/sim
        run: cargo test

      - name: prover/wrapper -- cargo fmt --check
        if: steps.check.outputs.wrapper == 'true'
        working-directory: prover/wrapper
        run: cargo fmt --check

      - name: prover/wrapper -- cargo clippy -D warnings (non-blocking, see note above)
        if: steps.check.outputs.wrapper == 'true'
        working-directory: prover/wrapper
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: prover/wrapper -- cargo test (real-pipeline tests stay #[ignore]d)
        if: steps.check.outputs.wrapper == 'true'
        working-directory: prover/wrapper
        run: cargo test

  # ---------------------------------------------------------------------
  # 6. REUSE license compliance (unchanged).
  # ---------------------------------------------------------------------
  reuse:
    name: REUSE license compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v5
