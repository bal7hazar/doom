[package]
name = "stwo_circuit_phases"
version.workspace = true
edition.workspace = true
description = "Resumable (N-phase) verification of stwo circuit proofs with proof sections as calldata"

[lib]

[dependencies]
stwo_circuit_air.workspace = true
stwo_verifier_core.workspace = true
stwo_constraint_framework.workspace = true
stwo_verifier_utils.workspace = true
bounded_int.workspace = true

[dev-dependencies]
snforge_std.workspace = true
assert_macros.workspace = true
stwo_circuit_air_ref.workspace = true
stwo_verifier_core_ref.workspace = true

[scripts]
test = "snforge test"

[tool]
scarb.workspace = true

[tool.snforge]
max_n_steps = 200000000
# starknet-devnet 0.10 / blockifier 0.14.4 bill these classes by VM steps + builtins: the
# receipts match this mode within 3 % (docs/design/onchain-verifier.md §7), while the default
# sierra-gas mode understates by 1.4-2.1x.
tracked_resource = "cairo-steps"
