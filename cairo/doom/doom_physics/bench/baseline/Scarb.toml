# The "without physics" side of the bytecode measurement: the same crate
# graph and the same level/table data as `../size`, no `doom_physics` call.
[package]
name = "doom_physics_baseline"
version = "0.1.0"
edition = "2024_07"

[dependencies]
doom_physics = { path = "../.." }
doom_map = { path = "../../../doom_map" }
doom_things = { path = "../../../doom_things" }
fixed = { path = "../../../../crates/fixed" }
geom2d = { path = "../../../../crates/geom2d" }
prng = { path = "../../../../crates/prng" }
fsm = { path = "../../../../crates/fsm" }
cairo_execute = "2.16.0"

[[target.executable]]
name = "doom_physics_baseline"
function = "doom_physics_baseline::main"
sierra = true

[cairo]
enable-gas = false
