[package]
name = "bigcode"
version = "0.1.0"
edition = "2024_07"

# Deliberately large bytecode, tiny run: isolates the *program-length* term of the leaf
# bootloader's overhead (S4b measurement 2, D4). `src/lib.cairo` is generated by `generate.py`.

[[target.executable]]
name = "bigcode"
function = "bigcode::main"

[dependencies]
cairo_execute = "2.18.0"

[cairo]
enable-gas = false
